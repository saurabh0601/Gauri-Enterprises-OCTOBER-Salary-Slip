<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Gauri Enterprises - Surlon India Limited Salary Slip Portal">
  <title>Salary Slip Portal | Gauri Enterprises - Surlon India Limited</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">GE</div>
      <div>
        <div class="company">Gauri Enterprises</div>
        <div class="subcompany">Surlon India Limited</div>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="badge">EMPLOYEE PORTAL</div>
      <h1>Salary Slip Download</h1>
      <p>Access your salary slip quickly and securely using your Employee ID.</p>

      <form id="searchForm" class="search-box">
        <label for="employeeId">Employee ID</label>
        <div class="input-row">
          <input id="employeeId" type="text" placeholder="Enter Employee ID" autocomplete="off" required>
          <button type="submit">Search</button>
        </div>
        <div class="example">Example: GE0001</div>
      </form>

      <div id="result" aria-live="polite"></div>
    </section>

    <section class="info">
      <div class="info-item"><strong>1</strong><span>Enter your Employee ID</span></div>
      <div class="info-item"><strong>2</strong><span>Click Search</span></div>
      <div class="info-item"><strong>3</strong><span>Download your salary slip</span></div>
    </section>
  </main>

  <footer>
    <div>Gauri Enterprises - Surlon India Limited</div>
    <div>Created by <strong>Saurabh Bhati</strong></div>
  </footer>

  <script src="js/script.js"></script>
</body>
</html>
